<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Редактор виджета — Open Stream Environment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="widget-editor.css" />
</head>
<body>
  <div id="app">
    <header class="editor-header">
      <span class="editor-header__title">Редактор виджета</span>
      <span class="editor-header__status" id="statusLabel"></span>
      <button class="md-button md-button--filled" id="saveBtn">Сохранить</button>
    </header>

    <div class="editor-body">
      <div class="editor-pane">
        <div class="editor-tabs" id="tabs">
          <button class="editor-tab is-active" data-tab="html">HTML</button>
          <button class="editor-tab" data-tab="css">CSS</button>
          <button class="editor-tab" data-tab="js">JS</button>
        </div>
        <textarea class="editor-textarea" id="codeHtml" spellcheck="false" placeholder="<div>Привет, стрим!</div>"></textarea>
        <textarea class="editor-textarea" id="codeCss" spellcheck="false" placeholder="div { color: #fff; font-size: 24px; }" hidden></textarea>
        <textarea class="editor-textarea" id="codeJs" spellcheck="false" placeholder="// выполняется по-настоящему, можно таймеры/анимации
console.log('widget loaded');" hidden></textarea>
      </div>

      <div class="editor-preview">
        <div class="editor-preview__label">Превью</div>
        <div class="editor-preview__frame-wrap">
          <iframe class="editor-preview__frame" id="previewFrame"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/events.js"></script>
  <script src="widget-editor.js"></script>
</body>
</html>
