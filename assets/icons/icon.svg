<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Иконка Open Stream Environment — Boosty">
<title>Open Stream Environment — Boosty icon</title>
<defs>
  <clipPath id="squircle"><rect x="0" y="0" width="512" height="512" rx="104" ry="104"/></clipPath>
  <linearGradient id="seamShadowL" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="seamShadowR" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
  </linearGradient>
  <filter id="textShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
    <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
    <feFlood flood-color="#000000" flood-opacity="0.45" result="shadowColor"/>
    <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
<g clip-path="url(#squircle)">
<polygon points="0,0 128.0,0 76.8,512 0,512" fill="#005FAF"/>
<polygon points="384.0,0 512,0 512,512 435.2,512" fill="#386595"/>
<polygon points="128.0,0 384.0,0 435.2,512 76.8,512" fill="#111318"/>
<polygon points="82.0,0 174.0,0 122.8,512 30.799999999999997,512" fill="url(#seamShadowL)"/>
<polygon points="338.0,0 430.0,0 481.2,512 389.2,512" fill="url(#seamShadowR)"/>
<text x="256" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="108" letter-spacing="6" fill="#FFFFFF" filter="url(#textShadow)">OSE</text>
</g>
<rect x="1" y="1" width="510" height="510" rx="103" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
</svg>
