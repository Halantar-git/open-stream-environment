<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSE — настройки кнопки</title>
  <style>
    :root {
      --bg: #0e0b17;
      --surface: #1b1e21;
      --text: #eceff1;
      --muted: #9aa0a6;
      --accent: #f39c12;
      --border: #2c3e50;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    label { display: block; color: var(--muted); margin-bottom: 6px; }
    select,
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
    }
    input[type="text"] { margin-bottom: 12px; }
    .hint { margin-top: 10px; color: var(--muted); font-size: 11px; }
    .fixed-scene {
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .counter { margin-top: 4px; color: var(--muted); font-size: 11px; text-align: right; }
  </style>
</head>
<body>
  <div id="root">
    <p>Загрузка…</p>
  </div>

  <script>
    let ws = null;
    let context = null;
    let actionUuid = null;
    let currentSettings = {};
    let options = null;
    let renderedSignature = null;

    const TICKER_TEXT_LIMIT = 300;

    function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo, inActionInfo) {
      ws = new WebSocket("ws://127.0.0.1:" + inPort);

      ws.onopen = function () {
        ws.send(JSON.stringify({ event: inRegisterEvent, uuid: inPluginUUID }));
      };

      ws.onmessage = function (ev) {
        let msg;
        try {
          msg = JSON.parse(ev.data);
        } catch {
          return;
        }
        if (msg.event === "didReceiveSettings") {
          currentSettings = (msg.payload && msg.payload.settings) || {};
          render();
        } else if (msg.event === "sendToPropertyInspector") {
          options = msg.payload || {};
          render();
        }
      };

      try {
        const info = JSON.parse(inActionInfo || "{}");
        context = info.context || null;
        actionUuid = info.action || null;
      } catch {
        context = null;
        actionUuid = null;
      }
    }

    // У плагина два действия с одной панелью настроек: сцены и сообщение
    // в ленту. Действие приходит в inActionInfo, поэтому панель не ждёт
    // ответа плагина, чтобы понять, какие поля рисовать.
    function isTicker() {
      return typeof actionUuid === "string" && actionUuid.endsWith(".ticker");
    }

    function save(patch) {
      currentSettings = Object.assign({}, currentSettings, patch);
      if (ws && context) {
        ws.send(JSON.stringify({ event: "setSettings", context, payload: currentSettings }));
      }
    }

    function makeSelect(value, items, onchange) {
      const select = document.createElement("select");
      items.forEach(function (item) {
        const opt = document.createElement("option");
        opt.value = item.id;
        opt.textContent = item.label || item.id;
        if (item.id === value) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener("change", function () {
        onchange(select.value);
      });
      return select;
    }

    function label(text) {
      const el = document.createElement("label");
      el.textContent = text;
      return el;
    }

    function hint(text) {
      const el = document.createElement("div");
      el.className = "hint";
      el.textContent = text;
      return el;
    }

    function input(value, maxLength, placeholder, oninput) {
      const el = document.createElement("input");
      el.type = "text";
      el.maxLength = maxLength;
      el.placeholder = placeholder || "";
      el.value = value;
      el.addEventListener("input", function () {
        oninput(el.value);
      });
      return el;
    }

    function renderTicker(root) {
      root.appendChild(label("Текст сообщения"));
      root.appendChild(input(currentSettings.text || "", TICKER_TEXT_LIMIT, "Например: скоро розыгрыш", function (value) {
        save({ text: value });
      }));

      root.appendChild(label("Приоритет"));
      root.appendChild(makeSelect(currentSettings.priority || "normal", [
        { id: "normal", label: "Обычное — в общую ленту" },
        { id: "breaking", label: "Срочно — отдельной полосой" },
      ], function (value) {
        save({ priority: value });
      }));

      root.appendChild(hint("До " + TICKER_TEXT_LIMIT + " символов. Срочное сообщение перекрывает ленту на несколько секунд и не ждёт её цикла."));
    }

    function renderScene(root) {
      const scenes = (options && options.scenes) || [];
      root.appendChild(label("Сцена"));
      root.appendChild(makeSelect(currentSettings.scene || "start", scenes, function (value) {
        save({ scene: value });
      }));
      root.appendChild(hint("Кнопка подсвечивается, когда сцена активна."));
    }

    // Действия вида `scene.<id>` несут сцену в своём UUID: выбирать нечего,
    // поэтому вместо списка показываем, какая сцена закреплена за кнопкой.
    function renderFixedScene(root) {
      root.appendChild(label("Сцена"));
      const name = document.createElement("div");
      name.className = "fixed-scene";
      name.textContent = (options && (options.label || options.scene)) || "";
      root.appendChild(name);
      root.appendChild(
        hint("Сцена закреплена за действием — кнопка сразу переключает её и подсвечивается, когда сцена активна. Нужна одна кнопка с выбором сцены — возьмите действие «Сцена (выбор в настройках)»."),
      );
    }

    function render() {
      const ticker = isTicker();
      const fixed = !!options && options.kind === "scene-fixed";
      const scenes = (options && options.scenes) || [];
      // Панель перерисовывается на каждое изменение настроек; если структура
      // та же, не пересоздаём поля — иначе каретка прыгает в начало строки
      // посреди набора текста.
      const signature = ticker
        ? "ticker"
        : fixed
          ? "scene-fixed:" + ((options && options.scene) || "")
          : "scene:" + scenes.map(function (s) { return s.id; }).join(",");
      if (signature === renderedSignature) return;
      renderedSignature = signature;

      const root = document.getElementById("root");
      root.innerHTML = "";
      if (ticker) renderTicker(root);
      else if (fixed) renderFixedScene(root);
      else renderScene(root);
    }
  </script>
</body>
</html>
