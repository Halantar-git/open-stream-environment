<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Монтаж алерта — Open Stream Environment</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/widgets.css" />
  <link rel="stylesheet" href="timeline-editor.css" />
</head>
<body>
  <div id="app">
    <header class="te-header">
      <span class="te-header__title" data-i18n="timelineEditor.title">Монтаж алерта</span>
      <span class="te-header__status" id="statusLabel"></span>
      <button class="md-button md-button--tonal" id="testBtn" type="button" data-i18n="timelineEditor.test">Тест</button>
      <button class="md-button md-button--filled" id="saveBtn" type="button" data-i18n="timelineEditor.save">Сохранить</button>
    </header>

    <main class="te-body">
      <section class="te-left">
        <div class="te-preview">
          <div class="te-preview__label">
            <span data-i18n="timelineEditor.preview">Превью</span>
            <span class="te-preview__hint" data-i18n="timelineEditor.previewHint"></span>
          </div>
          <div class="te-preview__box" id="previewBox">
            <div class="te-stage-wrap" id="stageWrap">
              <div class="te-stage widget-layer-alert-host" id="stage"></div>
              <div class="te-selection" id="selection" hidden>
                <div class="te-selection__move" data-dir="move"></div>
                <span class="te-handle" data-dir="nw"></span>
                <span class="te-handle" data-dir="n"></span>
                <span class="te-handle" data-dir="ne"></span>
                <span class="te-handle" data-dir="e"></span>
                <span class="te-handle" data-dir="se"></span>
                <span class="te-handle" data-dir="s"></span>
                <span class="te-handle" data-dir="sw"></span>
                <span class="te-handle" data-dir="w"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="te-timeline">
          <div class="te-timeline__toolbar">
            <span class="te-timeline__title" data-i18n="timelineEditor.timeline">Таймлайн</span>
            <label class="te-scope">
              <span data-i18n="timelineEditor.scopeLabel">Реакция</span>
              <select id="scopeSelect"></select>
            </label>
            <div class="te-reaction" id="reactionBanner"></div>
            <div class="te-timeline__actions">
              <button class="md-button md-button--tonal" id="addText" type="button">+ <span data-i18n="timelineEditor.addText">Текст</span></button>
              <button class="md-button md-button--tonal" id="addImage" type="button">+ <span data-i18n="timelineEditor.addImage">Картинка</span></button>
              <button class="md-button md-button--tonal" id="addVideo" type="button">+ <span data-i18n="timelineEditor.addVideo">Видео</span></button>
              <button class="md-button md-button--tonal" id="addAudio" type="button">+ <span data-i18n="timelineEditor.addAudio">Звук</span></button>
              <button class="md-button md-button--tonal" id="addShape" type="button">+ <span data-i18n="timelineEditor.addShape">Плашка</span></button>
            </div>
          </div>

          <div class="te-ruler">
            <span class="te-ruler__spacer" aria-hidden="true"></span>
            <div class="te-ruler__track" id="rulerTrack"></div>
          </div>

          <div class="te-rows" id="rows">
            <div class="te-playhead" id="playhead" hidden></div>
          </div>
        </div>
      </section>

      <aside class="te-side">
        <section class="te-panel">
          <h3 class="te-panel__title" data-i18n="timelineEditor.layers">Слои</h3>
          <div class="te-layer-list" id="layerList"></div>
        </section>

        <section class="te-panel">
          <h3 class="te-panel__title" data-i18n="timelineEditor.layer">Слой</h3>
          <div id="inspector"></div>
        </section>

        <section class="te-panel">
          <h3 class="te-panel__title" data-i18n="timelineEditor.composition">Композиция</h3>
          <div id="composition"></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="../shared/events.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/layer-composition.js"></script>
  <script src="timeline-editor.js"></script>
</body>
</html>
