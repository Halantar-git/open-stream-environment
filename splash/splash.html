<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Open Stream Environment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="splash.css" />
</head>
<body>
  <div class="splash-card">
    <div class="header">
      <div class="brand-name">Open Stream <span>Environment</span></div>
      <div class="subtitle" id="subtitle">Desktop</div>
    </div>

    <div class="console-log" id="logBox">
      <div class="log-line success">[OK] NODE.JS BACKEND INITIALIZED</div>
      <div class="log-line success">[OK] STARTING LOCAL SERVER...</div>
      <div class="log-line active">&gt; LOADING OVERLAY ENGINE...</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
  </div>

  <script src="splash.js"></script>
</body>
</html>
