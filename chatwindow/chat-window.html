<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Чат — Open Stream Environment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="chat-window.css" />
</head>
<body>
  <header class="chat-header">
    <span class="chat-header__title">Чат</span>
    <span class="chat-header__channel" id="channelLabel">—</span>
    <span class="md-chip" id="statusChip"><span class="md-chip__dot"></span><span id="statusLabel">—</span></span>

  <div class="chat-list" id="chatList"></div>
  <button class="jump-to-latest" id="jumpToLatest" hidden>Новые сообщения ↓</button>

  <script src="../shared/events.js"></script>
  <script src="chat-window.js"></script>
</body>
</html>
