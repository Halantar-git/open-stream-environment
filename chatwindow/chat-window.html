<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Чат — Open Stream Environment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="chat-window.css" />
</head>
<body>
  <header class="chat-header">
    <span class="chat-header__title" data-i18n="chatWindow.title">Чат</span>
    <span class="chat-header__channel" id="channelLabel">—</span>
    <span class="md-chip" id="statusChip"><span class="md-chip__dot"></span><span id="statusLabel">—</span></span>
    <button class="chat-header__pin" id="pinBtn" title="Закрепить поверх всех окон" aria-pressed="false">📌</button>
  </header>
  <div class="chat-list" id="chatList"></div>
  <button class="jump-to-latest" id="jumpToLatest" hidden data-i18n="chatWindow.newMessages">Новые сообщения ↓</button>
  <form class="chat-composer" id="chatComposer" autocomplete="off">
    <input class="chat-composer__input" id="chatInput" type="text" maxlength="500" placeholder="Сообщение в чат…" data-i18n-placeholder="chatWindow.sendPlaceholder" />
    <button class="chat-composer__send" id="chatSendBtn" type="submit" data-i18n="chatWindow.send">Отправить</button>
  </form>

  <script src="../shared/events.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/twitch-emotes.js"></script>
  <script src="chat-window.js"></script>
</body>
</html>
