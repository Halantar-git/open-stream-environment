# Публичный signaling OSE (Cloudflare Workers).
#
# Деплой:
#   cd signal
#   npx wrangler deploy
#
# OAuth2 GoodGame (необязательно, без этого работает только signaling):
#   npx wrangler secret put GOODGAME_CLIENT_ID
#   npx wrangler secret put GOODGAME_CLIENT_SECRET
#   npx wrangler secret put GOODGAME_REDIRECT_URI
# Секрет приложения остаётся здесь и в приложение не попадает.
#
# Рабочий адрес: wss://ose-signal.halantar.workers.dev (он же — умолчание
# в приложении). Свой домен можно привязать позже:
#   signal.ose-overlay.ru  ->  worker ose-signal
# (Workers → ose-signal → Settings → Domains & Routes; зона должна быть
# в том же аккаунте Cloudflare)
#
# Видимое имя воркера можно поменять; адрес сервиса задаётся в настройках
# приложения («Настройки → Гостевые камеры → Адрес signaling»).
name = "ose-signal"
main = "worker.js"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Одноразовые state и тикеты OAuth2 GoodGame: одна запись на вход, живут
# минуты, поэтому отдельного KV не нужно.
[[durable_objects.bindings]]
name = "TICKETS"
class_name = "TicketStore"

# SQLite-backed Durable Objects доступны на бесплатном плане Workers.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TicketStore"]
