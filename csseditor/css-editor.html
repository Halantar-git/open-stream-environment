<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>CSS темы</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="css-editor.css" />
  <script src="../shared/css-editor-core.js"></script>
</head>
<body>
  <header class="csswin-header">
    <span class="csswin-header__title" id="titleLabel">CSS темы</span>
    <span class="csswin-header__status" id="statusLabel"></span>
    <button class="csswin-done" id="doneBtn">Готово</button>
  </header>

  <div class="csswin-toolbar">
    <button class="csswin-btn" id="undoBtn" title="">↶</button>
    <button class="csswin-btn" id="redoBtn" title="">↷</button>
    <span class="csswin-toolbar__sep"></span>
    <button class="csswin-btn" id="selectAllBtn"></button>
    <button class="csswin-btn" id="clearBtn"></button>
    <button class="csswin-btn" id="copyBtn"></button>
    <span class="csswin-toolbar__sep"></span>
    <button class="csswin-btn" id="findBtn"></button>
    <button class="csswin-btn" id="replaceBtn"></button>
  </div>

  <div class="csswin-findbar" id="findBar" hidden>
    <input class="csswin-input" id="findInput" type="text" placeholder="">
    <button class="csswin-btn" id="findPrevBtn">↑</button>
    <button class="csswin-btn" id="findNextBtn">↓</button>
    <span class="csswin-toolbar__sep"></span>
    <input class="csswin-input" id="replaceInput" type="text" placeholder="">
    <button class="csswin-btn" id="replaceOneBtn"></button>
    <button class="csswin-btn" id="replaceAllBtn"></button>
    <button class="csswin-btn csswin-btn--close" id="closeFindBtn">✕</button>
  </div>

  <div class="csswin-body">
    <div id="editorWrap"></div>
    <div class="csswin-hint" id="hintLabel"></div>
  </div>

  <div class="csswin-statusbar">
    <span id="posLabel"></span>
    <span id="countLabel"></span>
  </div>

  <script type="module" src="css-editor.js"></script>
</body>
</html>
