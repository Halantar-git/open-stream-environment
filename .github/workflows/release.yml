name: Release

# Релиз собирает установщики под Windows, Linux и macOS, прогоняет линт и тесты и
# складывает всё в ОДИН черновик GitHub Release — оттуда их берёт встроенное
# автообновление (`tauri-plugin-updater` читает `latest.json` из ассетов релиза).
#
# Запуск: тег вида v3.2.9 (или вручную из вкладки Actions). Версия обязана
# совпадать в `package.json`, `src-tauri/tauri.conf.json` и теге — это проверяется
# первым шагом, иначе сборка остановится до того, как что-то уедет в релиз.
#
# Черновик создаёт и наполняет `tauri-action` по `tagName`: все job'ы матрицы
# пишут в один и тот же релиз по тегу, а не размножают его. Так было сломано на
# Electron-версии (v3.2.5): каждый job звал `electron-builder --publish` и создавал
# свой черновик. Проверяет, что сборщик ровно один, tests/ci-config.test.js.
#
# Подпись обновлений: приватный ключ `minisign` лежит в секрете
# `TAURI_SIGNING_PRIVATE_KEY` (и пароль — в
# `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`, если ключ с паролем). Публичный ключ —
# в `plugins.updater.pubkey` (`tauri.conf.json`). Ключ создаётся владельцем:
# `npx tauri signer generate -w %USERPROFILE%\.tauri\ose.key`, и приватную часть
# **никогда** не коммитят (release.bat делает `git add .`).
#
# Публикация намеренно разведена со сборкой: `releaseDraft: true` создаёт черновик,
# а видимым релиз делает владелец вручную — только тогда срабатывает notify-site.
#
# `latest.json` собирает отдельный workflow `updater-feed.yml` после матрицы
# (скрипт — `.github/scripts/updater-json.js`). Файл читает установленное
# приложение, а запись из трёх джоб одновременно оставляла релиз без фида —
# автообновление у всех отдавало 404.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Нужен, чтобы создать черновик релиза и загрузить в него ассеты.
permissions:
  contents: write

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Versions must agree and match the tag
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$tauri_version" ]; then
            echo "::error::Версия в package.json ($version) не совпадает с tauri.conf.json ($tauri_version)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией ($version)"
            exit 1
          fi
          echo "Версия: $version"

  publish:
    name: Build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Тесты перед сборкой: релиз не должен собираться из красного коммита.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        # Сеть раннера иногда не отдаёт манифест rustup (таймаут
        # static.rust-lang.org): повтор ниже спасает релиз от случайного красного.
        continue-on-error: true

      - name: Set up Rust (retry)
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # На Linux библиотеки WebKitGTK и GTK идут отдельно — без них крейт
      # `tauri` не соберётся, и упадёт даже `cargo test --lib`. Ставить их нужно
      # до тестов (как в ci.yml), иначе релизная сборка краснеет на Ubuntu.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Cargo test
        # Платформенные тесты уже гоняет ci.yml на каждый пуш. В релизе
        # оставляем дешёвый Linux-гейт, чтобы не собирать Rust дважды на
        # macOS и Windows перед релизной сборкой.
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # Сборка, подпись обновлений и загрузка в один черновик по тегу — на
      # `tauri-action`. Установщики всех платформ ложатся в один релиз вместе с
      # `.sig`, а фид `latest.json` собирает отдельная джоба ниже: параллельная
      # запись одного файла из трёх джоб — гонка, из-за которой 4.2.1 уехал без
      # фида и автообновление у всех отдавало 404.
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: "Список изменений — в CHANGELOG.md."
          releaseDraft: true
          prerelease: false
          # Имя входа именно такое: у `@v0` это `includeUpdaterJson`, а свежий
          # `uploadUpdaterJson` из ветки `dev` эта версия молча игнорирует —
          # из-за этого фид в 4.2.2 всё равно писала матрица.
          includeUpdaterJson: false

  # Фид автообновления — единственный файл, по которому обновляются установленные
  # копии (`plugins.updater.endpoints` в `tauri.conf.json`). Живёт отдельным
  # workflow: его же можно запустить вручную и починить фид уже собранного релиза,
  # не пересобирая установщики под три ОС. В матрице фид не пишется вообще —
  # параллельная запись одного ассета из трёх джоб оставила 4.2.1 без файла.
  updater-feed:
    name: Updater feed
    needs: [verify, publish]
    uses: ./.github/workflows/updater-feed.yml
    with:
      tag: v${{ needs.verify.outputs.version }}
    permissions:
      contents: write
    secrets: inherit
