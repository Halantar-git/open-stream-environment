name: Release

# Релиз делает то, что раньше приходилось делать руками: собирает установщики под
# Windows и Linux, прогоняет тесты и заливает артефакты в GitHub Release — оттуда
# их берёт встроенное автообновление (electron-updater читает latest.yml из
# ассетов релиза).
#
# Запуск: тег вида v3.2.0 (или вручную из вкладки Actions). Версия в package.json
# обязана совпадать с тегом — проверяется первым шагом, иначе сборка остановится
# до того, как что-то уедет в релиз.
#
# Собираются те же платформы, что и раньше: Windows (NSIS), Linux (AppImage и deb)
# и macOS (dmg и zip для arm64). macOS не подписывается — сертификата нет, поэтому
# Gatekeeper попросит подтвердить запуск; шаг оставлен, чтобы набор установщиков и
# файлы автообновления (latest.yml / latest-linux.yml / latest-mac.yml) не менялись.
#
# Второго workflow, который собирает релиз, быть не должно: два сборщика льют
# ассеты в один черновик наперегонки, и падает тот, кто дошёл вторым. Что такой
# дубль не вернётся, проверяет tests/ci-config.test.js.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Нужен для загрузки артефактов в релиз средствами GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tag must match package.json
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией в package.json ($version)"
            exit 1
          fi
          echo "Версия: $version"

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Тесты перед сборкой: релиз не должен собираться из красного коммита.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Публикацию отдаём electron-builder напрямую, а не через npm-скрипт.
      #
      # `npm run dist:win -- --publish always` не работает: npm считает
      # `--publish` своим ключом и не передаёт его скрипту, поэтому до сборщика
      # доезжает «electron-builder --win always», и он падает с «Unknown target:
      # always». Цель здесь задаётся флагом, а не именем скрипта; локальные
      # `npm run dist:win` / `dist:linux` остаются для сборки без публикации.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Сборки без сертификатов: на macOS electron-builder не должен искать
          # подпись (её нет), иначе шаг падает на поиске identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.target }} --publish always
