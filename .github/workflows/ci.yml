name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Lint & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    # Приложение поставляется на Windows, Linux и macOS, а тесты гоняются на всех
    # трёх: расхождение в путях, регистре имён или разделителях иначе всплывёт
    # только у пользователя собранной версии. fail-fast выключен, чтобы падение
    # одной платформы не скрывало состояние остальных.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Фронтенд (JS): он остаётся прежним и гоняется на Jest. ----
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Версия держится в одном месте: её же проверяет tests/ci-config.test.js
          # против engines.node в package.json.
          node-version: "22.12.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # ---- Бэкенд (Rust, src-tauri): гейт порта. ----
      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
        # Сеть раннера иногда не отдаёт манифест rustup (таймаут
        # static.rust-lang.org): повтор ниже спасает от случайного красного.
        continue-on-error: true

      - name: Set up Rust (retry)
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # На Linux, в отличие от Windows (WebView2 в системе) и macOS (WkWebView),
      # библиотеки WebKitGTK и GTK идут отдельно — без них крейт `tauri` не
      # соберётся, и упадут даже `cargo test --lib` и `cargo clippy`.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
