name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Lint & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    # Приложение поставляется на Windows, Linux и macOS, а тесты гоняются на всех
    # трёх: расхождение в путях, регистре имён или разделителях иначе всплывёт
    # только у пользователя собранной версии. fail-fast выключен, чтобы падение
    # одной платформы не скрывало состояние остальных.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Версия держится в одном месте: её же проверяет tests/ci-config.test.js
          # против engines.node в package.json.
          node-version: "22.12.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
