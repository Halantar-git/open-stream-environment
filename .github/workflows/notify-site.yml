name: Notify the site

# Сайт приложения (ose-website) показывает версию, дату и ссылки на файлы
# последнего релиза, но берёт их при своей выкладке — про новый релиз узнать сам
# он не может, потому что релиз выходит здесь. Поэтому после публикации релиза мы
# просим сайт пересобраться.
#
# Релиз публикуется вручную: `release.yml` создаёт черновик, а `releases/latest`
# черновиков не видит. Событие `release: published` срабатывает ровно в момент,
# когда версия становится видимой, — сайт не пересобирается впустую и не остаётся
# со старой версией.
#
# Нужен секрет SITE_DISPATCH_TOKEN — PAT с правом Contents: Read and write в
# репозитории сайта (у классического PAT — scope `repo`). Токен самого workflow
# для запроса в чужой репозиторий не годится.
#
# Что тип события и адрес не разойдутся с тем, что слушает сайт, проверяет
# tests/ci-config.test.js.

on:
  release:
    types: [published]
  # Ручной запуск — проверить связку (секрет, адрес, тип события), не выпуская
  # релиз: сайт просто пересоберётся ещё раз
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Ask ose-website to redeploy
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Нет секрета SITE_DISPATCH_TOKEN — сайт пересоберётся только по своему расписанию"
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/Halantar-git/ose-website/dispatches \
            -d '{"event_type":"app-release"}'
          echo "Сайт попросили пересобраться"
