<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Open Stream Environment — Голосование</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=PT+Sans+Caption:wght@400;700&family=Roboto+Condensed:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=block"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/widgets.css" />
  <link rel="stylesheet" href="overlay.css" />
  <link rel="stylesheet" href="scene.css" />
</head>
<body>
  <div class="scene-wrapper" aria-hidden="true">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div id="poll" class="poll" hidden>
    <div class="poll__card">
      <div class="poll__status">
        <span class="poll__status-dot"></span>
        <span class="poll__status-label" id="pollStatus"></span>
      </div>
      <div class="poll__title" id="pollTitle"></div>
      <div class="poll__chart" id="pollChart"></div>
      <div class="poll__footer" id="pollFooter"></div>
    </div>
  </div>

  <script src="/shared/events.js"></script>
  <script src="/shared/i18n.js"></script>
  <script src="poll-scene.js"></script>
</body>
</html>
