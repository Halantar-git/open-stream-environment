<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Open Stream Environment — Колесо Фортуны</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@500;700;900&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=Rubik+Glitch&family=Stardos+Stencil:wght@400;700&family=Syncopate:wght@400;700&family=Geologica:wght@400;500;700&family=Quantico:wght@400;700&family=Unbounded:wght@400;700&family=Jura:wght@400;700&family=Teko:wght@400;700&family=Overpass+Mono:wght@400;700&family=Russo+One&family=Monda:wght@400;700&family=Manrope:wght@400;700&family=Space+Grotesk:wght@400;700&family=Prompt:wght@400;700&family=Anonymous+Pro:wght@400;700&family=Chakra+Petch:wght@400;700&family=Tomorrow:wght@400;700&family=Black+Ops+One&family=Ubuntu+Mono:wght@400;700&family=Michroma&family=Wallpoet&family=Pixelify+Sans:wght@400;500;600;700&display=block"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/widgets.css" />
  <link rel="stylesheet" href="overlay.css" />
  <link rel="stylesheet" href="scene.css" />
</head>
<body>
  <div class="scene-wrapper" aria-hidden="true">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div id="wheel" class="wheel" hidden>
    <div class="wheel__stage">
      <div class="wheel__barrel">
        <canvas id="wheelCanvas" width="640" height="640"></canvas>
        <div class="wheel__hub"></div>
      </div>
      <div class="wheel__marker"></div>
      <div class="wheel__shadow"></div>
    </div>
  </div>

  <div id="wheel-participants" class="wheel-participants" hidden></div>
  <div id="wheel-result" class="wheel-result" hidden></div>

  <script src="/shared/events.js"></script>
  <script src="/shared/i18n.js"></script>
  <script src="wheel-scene.js"></script>
</body>
</html>
