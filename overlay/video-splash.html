<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Open Stream Environment — splash</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #splashVideo,
    #splashImage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    .splash-default {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background: #111318;
    }
    .splash-default__orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #386595, #005faf 58%, #0b0c0e);
      box-shadow: 0 0 70px rgba(0, 95, 175, 0.55);
      animation: splash-pulse 1.6s ease-in-out infinite;
    }
    .splash-default__label {
      font-family: "Segoe UI", "Roboto", Arial, sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 6px;
      color: #ffffff;
      text-align: center;
      padding: 0 24px;
    }
    @keyframes splash-pulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.14);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="defaultSplash" class="splash-default" hidden>
    <div class="splash-default__orb"></div>
    <div class="splash-default__label" id="defaultLabel">OPEN STREAM ENVIRONMENT</div>
  </div>
  <img id="splashImage" hidden alt="" />
  <video id="splashVideo" playsinline hidden></video>
  <script src="/shared/events.js"></script>
  <script src="video-splash.js"></script>
</body>
</html>
