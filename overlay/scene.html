<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Open Stream Environment — scene</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Pixelify+Sans:wght@400;500;600;700&family=VT323&family=IBM+Plex+Mono:wght@400;500;600;700&display=block"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="scene.css" />
</head>
<body>
  <div class="scene-wrapper">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    <div class="grid-overlay"></div>

    <main class="scene-card">
      <div class="status-chip">
        <span class="status-dot"></span>
        <span class="status-label" id="statusLabel"></span>
      </div>

      <h1 class="scene-title" id="sceneTitle"></h1>
      <p class="scene-subtitle" id="sceneSubtitle"></p>

      <div class="timer-box" id="timerBox">
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="timer-progress-bg">
          <div class="timer-progress-fill" id="timerProgress"></div>
        </div>
      </div>

      <div class="events-grid" id="eventsGrid">
        <div class="event-card">
          <div class="event-icon" data-icon="follow"></div>
          <div class="event-details">
            <span class="event-title" data-i18n="scene.follower">Фолловер</span>
            <span class="event-value" id="evFollower" data-i18n="scene.notYet">Пока нет</span>
          </div>
        </div>
        <div class="event-card">
          <div class="event-icon" data-icon="sub"></div>
          <div class="event-details">
            <span class="event-title" data-i18n="scene.subscriber">Подписчик</span>
            <span class="event-value" id="evSubscriber" data-i18n="scene.notYet">Пока нет</span>
          </div>
        </div>
        <div class="event-card">
          <div class="event-icon" data-icon="donation"></div>
          <div class="event-details">
            <span class="event-title" data-i18n="scene.topDonation">Топ донат</span>
            <span class="event-value" id="evTopDonation" data-i18n="scene.notYet">Пока нет</span>
          </div>
        </div>
      </div>

      <footer class="socials-footer" id="socialsFooter"></footer>
    </main>

    <div class="scene-chat" id="sceneChat" hidden>
      <div class="scene-chat__header">
        <span class="scene-chat__title" id="sceneChatTitle"></span>
      </div>
      <div class="scene-chat__list" id="sceneChatList"></div>
    </div>

    <div class="scene-alerts" id="sceneAlerts"></div>
  </div>

  <script src="/shared/events.js"></script>
  <script src="/shared/i18n.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/scenes-catalog.js"></script>
  <script src="/shared/twitch-emotes.js"></script>
  <script src="scene.js"></script>
</body>
</html>
