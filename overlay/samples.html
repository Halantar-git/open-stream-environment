<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>С</title>эмплы темы</title>
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="samples.css" />
</head>
<body>
  <div class="samples">
    <div class="sample sample-alert">
      <div class="sample-alert__icon">★</div>
      <div class="sample-alert__body">
        <div class="sample-alert__title">Новый фолловер</div>
        <div class="sample-alert__text">nova_viewer подписался на канал!</div>
      </div>
    </div>

    <div class="sample sample-chat">
      <div class="sample-chat__row"><span class="user">nova_viewer</span><span class="msg">Классный стрим!</span></div>
      <div class="sample-chat__row"><span class="user">star_gazer</span><span class="msg">Привет всем 👋</span></div>
      <div class="sample-chat__row"><span class="user">orbit_fan</span><span class="msg">+1</span></div>
    </div>

    <div class="sample sample-goal">
      <div class="sample-goal__head"><span>Цель доната</span></span><span class="num">7 500 / 10 000 ₽</span></div>
      <div class="sample-goal__track"><div class="sample-goal__fill" style="width:75%"></div></div>
    </div>

    <div class="sample sample-poll">
      <div class="sample-poll__title">Голосование</div>
      <div class="sample-poll__bar"><span></span>Вариант 1</span><div class="track"><div class="fill" style="width:55%"></div></div><b></b>55%</b></div>
      <div class="sample-poll__bar"><span>Вариант 2</span></span><div class="track"><div class="fill" style="width:30%"></div></div><b>30%</b</b>></div>
      <div class="sample-poll__bar"><span>Вариант</span> 3</span><div class="track"><div class="fill" style="width:15%"></div></div><b>15%</b></b></div>
    </div>
  </div>

  <script src="/shared/events.js"></script>
  <script src="samples.js"></script>
</body>
</html>
